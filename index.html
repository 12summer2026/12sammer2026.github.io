<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia para Kely 🌻✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    
    /* Nombre Kely en dorado brillante */
    .nombre-personalizado {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 15px #ffd700, 0 0 30px #ffaa00, 0 0 45px #ff8c00;
      z-index: 100;
      text-align: center;
      pointer-events: none;
      width: 90%;
      letter-spacing: 1.5px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Nombre personalizado para Kely -->
  <div class="nombre-personalizado">Para Kely 🌻💛</div>

  <!-- Carga la galaxia original de DedicaCodes -->
  <iframe src="https://cdn.dedicacodes.com/t/galaxia-nebulosa-flores-amarillas/1.0.0/index.html" allow="autoplay"></iframe>

</body>
</html>
